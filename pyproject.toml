[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brain1"
version = "0.1.0"
dependencies = [
    "requests>=2.32.5",
    "ripgrep-rs>=0.4.2",
    "zstandard>=0.25.0",
]

[project.scripts]
brain1 = "brain1:main"

[tool.setuptools.packages.find]
where = ["src"]
