[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brain1"
version = "0.1.0"
description = "Persistent memory layer for AI agents — store notes compressed with zstd, search instantly with ripgrep."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["cli", "ai-agents", "memory", "compression", "search", "ripgrep", "zstandard", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Topic :: System :: Archiving :: Compression",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "ripgrep-rs>=0.4.2",
    "zstandard>=0.25.0",
]

[project.scripts]
brain1 = "brain1:main"

[tool.setuptools.packages.find]
where = ["src"]
